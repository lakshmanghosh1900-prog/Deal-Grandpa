<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deal Grandpa — FIXTURE</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DEAL GRANDPA · FIXTURE</p>
      <h1>Let Grandpa check before you buy.</h1>
      <p class="lede">Same exact variant. Independent evidence. Plain advice. If the evidence is not strong enough, Grandpa will say so.</p>
    </header>
    <section class="query-card">
      <label for="query">What do you need?</label>
      <div class="query-row">
        <input id="query" value="I need a phone under 30000 with 8GB RAM 128GB storage">
        <button id="check">Check deals</button>
      </div>
      <div class="buttons" hidden><button id="break" class="secondary">Break-it: timeout once</button><button id="clear" class="secondary">Clear fault</button></div>
      <p id="mode" class="muted">FIXTURE mode · ADVISOR=none · network calls: none</p>
    </section>
    <section id="result"><div class="empty">Grandpa is ready. Ask him to check a deal.</div></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
