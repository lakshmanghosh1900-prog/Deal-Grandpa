[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-grandpa"
version = "0.1.0"
description = "Evidence-first, honest shopping decisions"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "rfc8785==0.1.4",
  "typer==0.15.1",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
deal-grandpa = "deal_grandpa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deal_grandpa = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
